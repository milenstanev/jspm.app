<div class="panel panel-default">
  <div class="panel-heading">
    <h2 class="panel-title">Counter</h2>
  </div>
  <div class="panel-body text-center">
    <div class="counter-display feature-display well">{{ $ctrl.value }}</div>
    <div class="counter-actions btn-group">
      <button type="button" class="btn btn-default" ng-click="$ctrl.decrement()">Decrement</button>
      <button type="button" class="btn btn-primary" ng-click="$ctrl.increment()">Increment</button>
    </div>
  </div>
</div>
