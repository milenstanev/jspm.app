<div class="panel panel-default" data-testid="jspm-user-form">
  <div class="panel-heading">
    <h1 class="panel-title">{{ $ctrl.title }}</h1>
  </div>
  <div class="panel-body">
    <p class="text-muted" ng-if="$ctrl.loading">Loading schema…</p>
    <p class="text-danger" ng-if="$ctrl.error" role="alert">{{ $ctrl.error }}</p>
    <p class="text-success" ng-if="$ctrl.status" role="status">{{ $ctrl.status }}</p>

    <form name="userForm"
          novalidate
          ng-if="$ctrl.record && $ctrl.fields.length"
          ng-submit="$ctrl.submit()">
      <div class="form-group" ng-repeat="key in $ctrl.fields">
        <label class="control-label"
               ng-attr-for="field-{{ key }}"
               ng-if="$ctrl.schema[key].formType !== 'checkbox'">{{ $ctrl.labelFor(key) }}</label>

        <select class="form-control"
                ng-if="$ctrl.schema[key].formType === 'select'"
                ng-attr-id="field-{{ key }}"
                ng-model="$ctrl.record[key]"
                ng-options="opt.val as opt.text for opt in $ctrl.schema[key].options">
        </select>

        <div class="checkbox"
             ng-if="$ctrl.schema[key].formType === 'checkbox'">
          <label>
            <input type="checkbox"
                   ng-attr-id="field-{{ key }}"
                   ng-model="$ctrl.record[key]">
            {{ $ctrl.labelFor(key) }}
          </label>
        </div>

        <input type="text"
               class="form-control"
               ng-if="$ctrl.schema[key].formType !== 'select' && $ctrl.schema[key].formType !== 'checkbox'"
               ng-attr-id="field-{{ key }}"
               ng-model="$ctrl.record[key]">
      </div>

      <button type="submit"
              class="btn btn-primary"
              ng-disabled="$ctrl.saving">
        {{ $ctrl.saving ? 'Saving…' : 'Update user' }}
      </button>
    </form>
  </div>
</div>
