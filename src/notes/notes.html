<h2>Notes</h2>
<form ng-submit="$ctrl.add()" novalidate>
  <input type="text"
         ng-model="$ctrl.input"
         placeholder="New note..."
         aria-label="New note">
  <button type="submit">Add</button>
</form>
<ul class="notes-list">
  <li ng-repeat="item in $ctrl.items track by $index">
    {{ item }}
    <button ng-click="$ctrl.remove($index)">Remove</button>
  </li>
</ul>
